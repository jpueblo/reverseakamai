[package]
name = "native-payload"
description = "Provider-agnostic native browser payload construction, device profiles, biometrics, templates, and ciphers"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/9xz/native-payload"

[dependencies]
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

# Explicit assembly backends are enabled only on the covered Linux x64 target.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
sha1 = { version = "0.10", features = ["asm"] }
sha2 = { version = "0.10", features = ["asm"] }
